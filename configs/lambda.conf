# Lambda repositories
#
#
# Git repository with the Lambda scripts (used by 'lambda update')
LAMBDA_REPO="https://github.com/VindLinux/lambda-manager"

# Git repositories with the package recipes (used by 'lambda sync')
#
# Priority: the official repository first, then COMMUNITY_RECIPES_REPO_<n> in numeric order.
# When a package exists in more than one repository the highest priority one wins, so a
# community repository can add packages but never replace an official one.
# Empty COMMUNITY_RECIPES_REPO_<n> are ignored. Add as many as you like.
#
# WARNING: recipes are shell code that runs as root. Only add repositories you trust.
OFFICIAL_RECIPES_REPO="https://github.com/VindLinux/vind-packages"
COMMUNITY_RECIPES_REPO_1=""
COMMUNITY_RECIPES_REPO_2=""
# COMMUNITY_RECIPES_REPO_3="https://example.com/someone/lambda-recipes.git"

# Directory that holds one directory per package (the same in every recipes repository)
RECIPES_SUBDIR="database"
